---
layout: default
---
<article class="unidad">
  <header class="unidad-header">
    <h1>{{ page.title }}</h1>
    {% if page.ra %}
      <p class="unidad-meta"><strong>RA asociado:</strong> {{ page.ra }}</p>
    {% endif %}
    {% if page.horas %}
      <p class="unidad-meta"><strong>Duración estimada:</strong> {{ page.horas }} h</p>
    {% endif %}
  </header>

  {{ content }}

  {% include bloque-nav.html %}
</article>
