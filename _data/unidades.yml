# _data/unidades.yml
# Secuenciación oficial del módulo PMDM, según PMDM_presentacion_modulo.pptx
# (sustituye la numeración UD0-UD7 del documento curricular inicial, obsoleta).
# disponible: true cuando ya existe la página de la unidad en _unidades/.
# bloque agrupa las unidades tal y como aparecen en la diapositiva 4 de la
# presentación del módulo ("Así se organiza el módulo").

- id: UD1
  tipo: unidad
  bloque: "Introducción"
  titulo: "Tecnologías para dispositivos móviles"
  resumen: "Panorama rápido de dispositivos móviles, hardware y limitaciones; nativo vs. multiplataforma, entornos y emuladores; estructura y ciclo de vida de una app."
  ra: "RA1"
  horas: 2
  slug: ud1
  disponible: true

- id: UD2
  tipo: unidad
  bloque: "Introducción"
  titulo: "Introducción a Kotlin y Android Studio"
  resumen: "Repaso de POO desde Java, sintaxis de Kotlin (null-safety, data classes, funciones de extensión, lambdas, introducción a coroutines) e instalación de Android Studio."
  ra: "Unidad puente (sin RA propio)"
  horas: 12
  slug: ud2
  disponible: true

- id: UD3
  tipo: unidad
  bloque: "RA1–RA2 · Aplicaciones"
  titulo: "Interfaz de usuario con Jetpack Compose"
  resumen: "Componentes @Composable, estado y recomposición, listas con LazyColumn/LazyRow, navegación, imágenes, eventos de entrada y DataStore."
  ra: "RA2 (1/3)"
  horas: 9
  slug: ud3
  disponible: false

- id: UD4
  tipo: unidad
  bloque: "RA1–RA2 · Aplicaciones"
  titulo: "Persistencia y almacenamiento"
  resumen: "Bases de datos y almacenamiento en el dispositivo; persistencia de la información de la aplicación."
  ra: "RA2 (2/3)"
  horas: 7
  slug: ud4
  disponible: false

- id: UD5
  tipo: unidad
  bloque: "RA1–RA2 · Aplicaciones"
  titulo: "Conectividad, sensores y permisos"
  resumen: "Tareas en segundo plano y servicios; seguridad y permisos; conectividad HTTP/HTTPS; sensores, posicionamiento y mapas."
  ra: "RA2 (3/3, cierre del RA)"
  horas: 9
  slug: ud5
  disponible: false

- id: EX1
  tipo: examen
  bloque: "RA1–RA2 · Aplicaciones"
  titulo: "Examen 1ª evaluación"
  resumen: "Repaso y examen de RA1 y RA2 completos (tecnologías, interfaz, persistencia y conectividad)."
  ra: "RA1 + RA2"
  horas: 4
  slug:
  disponible: false

